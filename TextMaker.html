<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Website Analyzer</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
    <div class="container mx-auto px-4 py-8">
        <h1 class="text-3xl font-bold text-center mb-8">Website Analyzer</h1>
        <div class="max-w-md mx-auto bg-white p-8 rounded shadow">
            <label for="urlInput" class="block text-gray-700 text-sm font-bold mb-2">Enter a URL:</label>
            <input id="urlInput" type="text" placeholder="https://example.com" class="w-full px-3 py-2 mb-4 border rounded" />
            <button id="analyzeButton" class="w-full bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded">
                Analyze Website
            </button>
        </div>
        <div id="results" class="max-w-2xl mx-auto mt-8"></div>
    </div>
    <script>
        document.getElementById('analyzeButton').addEventListener('click', function() {
            const urlInput = document.getElementById('urlInput').value.trim();

            if (!urlInput) {
                alert('Please enter a URL.');
                return;
            }

            // Show loading indicator
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = '<p class="text-center text-gray-500">Analyzing...</p>';

            fetch('https://your-api-endpoint.com/analyze', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ url: urlInput }),
            })
            .then(response => {
                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }
                return response.json();
            })
            .then(data => {
                displayResults(data, urlInput);
            })
            .catch(error => {
                resultsDiv.innerHTML = `<p class="text-red-500">An error occurred: ${error.message}</p>`;
            });
        });

        function displayResults(data, url) {
            const resultsDiv = document.getElementById('results');
            let html = `
                <h2 class="text-2xl font-bold mb-4">Analysis Results</h2>
                <h3 class="text-xl font-semibold mt-4">Pros:</h3>
                <ul class="list-disc pl-5">
                    ${data.pros.length > 0 ? data.pros.map(item => `<li>${item}</li>`).join('') : '<li>No pros found.</li>'}
                </ul>
                <h3 class="text-xl font-semibold mt-4">Cons:</h3>
                <ul class="list-disc pl-5">
                    ${data.cons.length > 0 ? data.cons.map(item => `<li>${item}</li>`).join('') : '<li>No cons found.</li>'}
                </ul>
                <h3 class="text-xl font-semibold mt-4">Message:</h3>
                <p class="mt-2">
                    ${generatePersonalizedMessage(data.pros, data.cons, url)}
                </p>
            `;

            resultsDiv.innerHTML = html;
        }

        function generatePersonalizedMessage(pros, cons, url) {
            const companyName = extractCompanyName(url);

            // Start the message
            let message = `Hey ${companyName},<br><br>`;

            // Praise them for their amazing website and compliment it
            if (pros.length > 0) {
                message += "I just wanted to say that your website is amazing! I really appreciate ";
                message += pros.join(', ') + ". ";
            } else {
                message += "I just wanted to say that your website has great potential. ";
            }

            // Mention there are some things that could be worked on and give examples
            if (cons.length > 0) {
                message += "However, there are some things that could be worked on, such as ";
                message += cons.join(' and ') + ". ";
            }

            // Add the personal note about being 16 and working on a school project
            message += "I'm 16 and working on a school project where I'm trying to find business websites and help improve them. I'm not trying to charge anything and would appreciate your feedback. Would you mind checking it out and answering a few questions on how I could make it better?";

            return message;
        }

        function extractCompanyName(url) {
            // Extract the hostname from the URL
            let hostname = '';
            try {
                hostname = new URL(url).hostname;
            } catch (e) {
                hostname = url;
            }

            // Remove 'www.' prefix if it exists
            if (hostname.startsWith('www.')) {
                hostname = hostname.slice(4);
            }

            // Remove domain extensions (.com, .net, etc.)
            const parts = hostname.split('.');
            const companyName = parts[0];

            // Capitalize the first letter
            return companyName.charAt(0).toUpperCase() + companyName.slice(1);
        }
    </script>
</body>
</html>
