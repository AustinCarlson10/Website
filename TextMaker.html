<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Website Analyzer</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
    <div class="container mx-auto px-4 py-8">
        <h1 class="text-3xl font-bold text-center mb-8">Website Analyzer</h1>
        <div class="max-w-md mx-auto bg-white p-8 rounded shadow">
            <label for="urlInput" class="block text-gray-700 text-sm font-bold mb-2">Enter a URL:</label>
            <input id="urlInput" type="text" placeholder="https://example.com" class="w-full px-3 py-2 mb-4 border rounded" />
            <button id="analyzeButton" class="w-full bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded">
                Analyze Website
            </button>
        </div>
        <div id="results" class="max-w-2xl mx-auto mt-8"></div>
    </div>
    <script>
        document.getElementById('analyzeButton').addEventListener('click', function() {
            const urlInput = document.getElementById('urlInput').value.trim();

            if (!urlInput) {
                alert('Please enter a URL.');
                return;
            }

            // Show loading indicator
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = '<p class="text-center text-gray-500">Analyzing...</p>';

            fetch('https://f3k6axmnk3uiduupw3q75zwjxu0swdnn.lambda-url.us-west-2.on.aws/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ url: urlInput }),
            })
            .then(response => {
                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }
                return response.json();
            })
            .then(data => {
                displayResults(data);
            })
            .catch(error => {
                resultsDiv.innerHTML = `<p class="text-red-500">An error occurred: ${error.message}</p>`;
            });
        });

        function displayResults(data) {
            const resultsDiv = document.getElementById('results');
            let html = `
                <h2 class="text-2xl font-bold mb-4">Analysis Results</h2>
                <h3 class="text-xl font-semibold mt-4">Phone Numbers:</h3>
                <p>${data.phone_numbers.length > 0 ? data.phone_numbers.join(', ') : 'None found.'}</p>
                <h3 class="text-xl font-semibold mt-4">Emails:</h3>
                <p>${data.emails.length > 0 ? data.emails.join(', ') : 'None found.'}</p>
                <h3 class="text-xl font-semibold mt-4">Compliments:</h3>
                <ul class="list-disc pl-5">
                    ${data.compliments.length > 0 ? data.compliments.map(item => `<li>${item}</li>`).join('') : '<li>None.</li>'}
                </ul>
                <h3 class="text-xl font-semibold mt-4">Issues Found:</h3>
                <ul class="list-disc pl-5">
                    ${data.issues_found.length > 0 ? data.issues_found.map(item => `<li>${item}</li>`).join('') : '<li>None.</li>'}
                </ul>
                <h3 class="text-xl font-semibold mt-4">AI Generated Text:</h3>
                <p class="mt-2">${data.ai_generated_text}</p>
            `;

            // Add the text prompt for sending results
            html += `
                <div class="mt-8">
                    <p class="text-lg font-semibold">How would you like to receive the results? Please type "phone" or "email":</p>
                    <input id="methodInput" type="text" placeholder="phone or email" class="w-full px-3 py-2 mt-2 mb-4 border rounded" />
                    <button id="submitMethod" class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded">
                        Submit
                    </button>
                    <div id="contactForm" class="mt-4"></div>
                </div>
            `;

            resultsDiv.innerHTML = html;

            // Add event listener for the submit method button
            document.getElementById('submitMethod').addEventListener('click', function() {
                const method = document.getElementById('methodInput').value.trim().toLowerCase();
                if (method === 'phone' || method === 'email') {
                    showContactForm(method, data);  // Pass the data to use later
                } else {
                    alert('Please enter "phone" or "email".');
                }
            });
        }

        function showContactForm(method, data) {
            const contactFormDiv = document.getElementById('contactForm');
            contactFormDiv.innerHTML = '';

            if (method === 'phone') {
                contactFormDiv.innerHTML = `
                    <label for="phoneInput" class="block text-gray-700 text-sm font-bold mb-2">Enter your Phone Number:</label>
                    <input id="phoneInput" type="tel" placeholder="+1..." class="w-full px-3 py-2 mb-4 border rounded" />
                    <button id="submitPhone" class="bg-green-500 hover:bg-green-700 text-white font-bold py-2 px-4 rounded">Send Results</button>
                `;

                document.getElementById('submitPhone').addEventListener('click', function() {
                    const phoneNumber = document.getElementById('phoneInput').value.trim();
                    if (!phoneNumber) {
                        alert('Please enter your phone number.');
                        return;
                    }
                    sendResults('phone', phoneNumber, data);
                });

            } else if (method === 'email') {
                contactFormDiv.innerHTML = `
                    <label for="emailInput" class="block text-gray-700 text-sm font-bold mb-2">Enter your Email Address:</label>
                    <input id="emailInput" type="email" placeholder="you@example.com" class="w-full px-3 py-2 mb-4 border rounded" />
                    <button id="submitEmail" class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded">Send Results</button>
                `;

                document.getElementById('submitEmail').addEventListener('click', function() {
                    const emailAddress = document.getElementById('emailInput').value.trim();
                    if (!emailAddress) {
                        alert('Please enter your email address.');
                        return;
                    }
                    sendResults('email', emailAddress, data);
                });
            }
        }

        function sendResults(method, contactInfo, data) {
            // Simulate sending results by displaying a confirmation message
            const contactFormDiv = document.getElementById('contactForm');
            contactFormDiv.innerHTML = `
                <p class="mt-4 text-green-600">Results have been sent to your ${method === 'phone' ? 'phone number' : 'email'}: ${contactInfo}</p>
            `;

            // Prepare the payload to send
            const payload = {
                method: method,
                contactInfo: contactInfo,
                data: data
            };

            // Here, you would typically make a request to your backend server
            // to handle sending the results via SMS or email.
            // For example:
            /*
            fetch('/send-results', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(payload),
            })
            .then(response => response.json())
            .then(result => {
                // Handle success
            })
            .catch(error => {
                // Handle error
            });
            */
        }
    </script>
</body>
</html>
